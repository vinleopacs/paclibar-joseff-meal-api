<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Food Menu</title>
<style>
  :root{
    --bg:#F2F2F7;
    --surface:#FFFFFF;
    --text:#1C1C1E;
    --text-secondary:#8E8E93;
    --divider:#E5E5EA;
    --accent:#007AFF;
    --accent-press:#0062CC;
    --breakfast:#FF9500;
    --lunch:#34C759;
    --snack:#AF52DE;
    --danger:#FF3B30;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:0 0 64px;
  }

  main{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
  }

  /* Large-title nav bar */
  .navbar{
    padding:60px 20px 8px;
  }
  .navbar h1{
    margin:0;
    font-size:34px;
    font-weight:700;
    letter-spacing:-0.4px;
  }
  .navbar p{
    margin:4px 0 0;
    font-size:15px;
    color:var(--text-secondary);
  }

  /* Search-style row */
  .search-row{
    display:flex;
    gap:10px;
    padding:16px 20px 4px;
  }
  .search-field{
    flex:1;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border-radius:10px;
    padding:0 12px;
    height:36px;
  }
  .search-field svg{ flex-shrink:0; opacity:0.55; }
  .search-field input{
    border:none;
    outline:none;
    background:transparent;
    font-size:17px;
    width:100%;
    color:var(--text);
  }
  .search-field input::placeholder{ color:var(--text-secondary); }

  button.find{
    border:none;
    background:none;
    color:var(--accent);
    font-size:17px;
    font-weight:600;
    padding:0 4px;
    cursor:pointer;
  }
  button.find:active{ color:var(--accent-press); }

  /* Primary action button */
  .actions{ padding:16px 20px 4px; }
  .btn-primary{
    width:100%;
    border:none;
    background:var(--accent);
    color:#fff;
    font-size:17px;
    font-weight:600;
    padding:13px 0;
    border-radius:12px;
    cursor:pointer;
    transition:transform .08s ease, background .08s ease;
  }
  .btn-primary:active{
    background:var(--accent-press);
    transform:scale(0.98);
  }

  /* Status line */
  #status{
    padding:18px 20px 6px;
    margin:0;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.4px;
    color:var(--text-secondary);
    min-height:16px;
  }
  #status.error{ color:var(--danger); text-transform:none; letter-spacing:0; }

  /* Grouped list */
  .list-wrap{ padding:0 20px; }
  ul#mealList{
    list-style:none;
    margin:0;
    padding:0;
    background:var(--surface);
    border-radius:14px;
    overflow:hidden;
  }
  ul#mealList li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px 16px;
    border-bottom:1px solid var(--divider);
  }
  ul#mealList li:last-child{ border-bottom:none; }

  .meal-main{ min-width:0; }
  .meal-name{
    font-size:17px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meal-tag{
    display:inline-block;
    margin-top:4px;
    font-size:12px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    color:#fff;
  }
  .tag-breakfast{ background:var(--breakfast); }
  .tag-lunch{ background:var(--lunch); }
  .tag-snack{ background:var(--snack); }
  .tag-other{ background:var(--text-secondary); }

  .meal-price{
    font-size:17px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
  }
  .meal-id{
    font-size:12px;
    color:var(--text-secondary);
    margin-top:2px;
  }

  .empty-state{
    padding:40px 16px;
    text-align:center;
    color:var(--text-secondary);
    font-size:15px;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --surface:#1C1C1E;
      --text:#FFFFFF;
      --text-secondary:#8E8E93;
      --divider:#38383A;
    }
  }
</style>
</head>

<body>
<main>

  <div class="navbar">
    <h1>Campus Menu</h1>
    <p>Browse what's on offer today</p>
  </div>

  <div class="search-row">
    <div class="search-field">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="7" cy="7" r="5.5" stroke="#8E8E93" stroke-width="1.5"/>
        <line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="number" id="mealId" placeholder="Enter meal ID">
    </div>
    <button class="find" onclick="findMeal()">Find</button>
  </div>

  <div class="actions">
    <button class="btn-primary" onclick="loadMeals()">Load All Meals</button>
  </div>

  <p id="status"></p>

  <div class="list-wrap">
    <ul id="mealList"></ul>
  </div>

</main>

<script>
  const categoryClass = (category) => {
    const key = (category || "").toLowerCase();
    if (key === "breakfast") return "tag-breakfast";
    if (key === "lunch") return "tag-lunch";
    if (key === "snack") return "tag-snack";
    return "tag-other";
  };

  async function loadMeals(){
    setStatus("Loading…");
    try{
      const response = await fetch("api/meals");
      const meals = await response.json();
      renderMeals(meals);
    }catch(err){
      setStatus("Couldn't reach the server", true);
      renderMeals([]);
    }
  }

  async function findMeal(){
    const id = document.getElementById("mealId").value;

    if(!id){
      setStatus("Enter a meal ID first", true);
      return;
    }

    setStatus("Searching…");

    try{
      const response = await fetch("api/meals/" + id);

      if(!response.ok){
        setStatus("Meal not found", true);
        renderMeals([]);
        return;
      }

      const meal = await response.json();
      renderMeals([meal]);
    }catch(err){
      setStatus("Couldn't reach the server", true);
      renderMeals([]);
    }
  }

  function setStatus(text, isError){
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = isError ? "error" : "";
  }

  function renderMeals(meals){
    const list = document.getElementById("mealList");
    list.innerHTML = "";

    if(!meals.length){
      list.innerHTML = '<li class="empty-state" style="display:block;">No meals to show</li>';
      return;
    }

    if(!document.getElementById("status").classList.contains("error")){
      setStatus("Showing " + meals.length + " meal" + (meals.length === 1 ? "" : "s"));
    }

    meals.forEach(meal => {
      const li = document.createElement("li");
      li.innerHTML =
        '<div class="meal-main">' +
          '<div class="meal-name">' + meal.name + '</div>' +
          '<span class="meal-tag ' + categoryClass(meal.category) + '">' + meal.category + '</span>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div class="meal-price">&#8369;' + meal.price + '</div>' +
          '<div class="meal-id">ID ' + meal.id + '</div>' +
        '</div>';
      list.appendChild(li);
    });
  }
</script>

</body>
</html>
